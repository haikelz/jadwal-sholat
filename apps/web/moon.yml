$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
tags: ["astro"]
dependsOn: ["core"]

tasks:
  dev:
    script: "bun run dev"
    preset: "server"
  build:
    script: "bun run build"
  check:
    script: "bun run check"
  # Expects `bun run preview` running on port 4321.
  test:
    script: "bun run test"
